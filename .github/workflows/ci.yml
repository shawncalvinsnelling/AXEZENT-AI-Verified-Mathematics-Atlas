name: Atlas Verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest sympy

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q

      - name: Run six-cycle symbolic threshold audit
        run: |
          PYTHONPATH=. python papers/six-cycle-hook-unimodality-2026/verification/symbolic_threshold_audit.py

      - name: Run Atlas audit
        run: |
          PYTHONPATH=. python -m axezent_ai_verified_math.run_audit
