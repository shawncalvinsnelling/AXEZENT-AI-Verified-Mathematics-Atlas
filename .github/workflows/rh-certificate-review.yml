name: RH finite-certificate replay

on:
  pull_request:
    paths:
      - 'research/riemann-hypothesis/**'
      - '.github/workflows/rh-certificate-review.yml'
  push:
    paths:
      - 'research/riemann-hypothesis/**'
      - '.github/workflows/rh-certificate-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-certificate:
    name: Finite domain / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Replay exact finite certificate and negative controls
        working-directory: research/riemann-hypothesis
        run: python replay.py
