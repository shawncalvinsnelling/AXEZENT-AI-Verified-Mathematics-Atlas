name: Build six-cycle preprint PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "papers/six-cycle-hook-unimodality-2026/*.tex"
      - ".github/workflows/build-six-cycle-preprint.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Compile paper
        working-directory: papers/six-cycle-hook-unimodality-2026
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Snelling_Six_Cycle_Hook_Unimodality_2026-09-22.tex
          pdflatex -interaction=nonstopmode -halt-on-error Snelling_Six_Cycle_Hook_Unimodality_2026-09-22.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/six-cycle-hook-unimodality-2026/Snelling_Six_Cycle_Hook_Unimodality_2026-09-22.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build six-cycle hook-unimodality PDF"
            git push
          fi
